# Local full stack: PostgreSQL + Spring Boot API + Mailpit (catches outgoing emails).
#   docker compose up --build
#   API:     http://localhost:8080/api/destinations
#   Mailpit: http://localhost:8025
# Then run the frontend with `npm run dev` in ./frontend (it proxies /api to :8080).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beyondthemap
      POSTGRES_USER: beyondthemap
      POSTGRES_PASSWORD: beyondthemap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyondthemap"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/beyondthemap
      DB_USER: beyondthemap
      DB_PASSWORD: beyondthemap
      CORS_ORIGINS: http://localhost:5173
      MAIL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      ADMIN_PASSWORD: change-me
    ports:
      - "8080:8080"

volumes:
  pgdata:
